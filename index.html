<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Цезарь | Шифровальщик</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: radial-gradient(ellipse at 20% 30%, #0a0f2a, #040717);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            position: relative;
        }

        /* Анимированный фон */
        body::before {
            content: '';
            position: fixed;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background: radial-gradient(circle, rgba(80, 140, 255, 0.08) 0%, transparent 70%);
            animation: slowRotate 40s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes slowRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .main-card {
            max-width: 1400px;
            width: 100%;
            background: rgba(10, 15, 35, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 2.5rem;
            box-shadow: 0 25px 55px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(80, 160, 255, 0.25);
            overflow: hidden;
            position: relative;
            z-index: 2;
            transition: all 0.3s ease;
        }

        .header {
            padding: 1.2rem 2rem;
            background: linear-gradient(115deg, rgba(20, 30, 65, 0.9), rgba(10, 15, 40, 0.9));
            border-bottom: 1px solid rgba(80, 140, 255, 0.4);
            position: relative;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(125deg, #FFFFFF, #7CB8FF, #3A86FF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.3px;
        }

        .two-col {
            display: flex;
            flex-wrap: wrap;
            gap: 0;
        }

        .sidebar {
            width: 270px;
            background: rgba(8, 12, 28, 0.7);
            border-right: 1px solid rgba(70, 130, 255, 0.3);
            padding: 1.8rem 1.2rem;
            backdrop-filter: blur(4px);
        }

        .mode-section {
            background: linear-gradient(135deg, rgba(20, 30, 55, 0.7), rgba(15, 22, 45, 0.8));
            border-radius: 1.5rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(80, 140, 255, 0.35);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .mode-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
        }

        .mode-btn {
            flex: 1;
            background: rgba(30, 40, 70, 0.8);
            border: none;
            padding: 10px 0;
            border-radius: 60px;
            color: #ccdcff;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 0.5px;
            backdrop-filter: blur(4px);
        }

        .mode-btn.active {
            background: linear-gradient(95deg, #3a7bd5, #1e4a8a);
            color: white;
            box-shadow: 0 4px 15px rgba(58, 123, 213, 0.4);
            text-shadow: 0 0 3px rgba(0,0,0,0.2);
        }

        .shift-control {
            margin-top: 12px;
        }

        .shift-control label {
            font-size: 0.7rem;
            color: #9bb2f0;
            font-weight: 500;
        }

        input[type="range"] {
            width: 100%;
            margin: 10px 0;
            background: #1e2a50;
            height: 5px;
            border-radius: 10px;
            -webkit-appearance: none;
        }

        input[type="range"]:focus {
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #8bb5ff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 8px #4c7eff;
            border: 2px solid white;
        }

        .shift-value {
            background: rgba(0, 0, 0, 0.5);
            text-align: center;
            padding: 6px;
            border-radius: 40px;
            font-family: monospace;
            font-size: 0.85rem;
            font-weight: bold;
            color: #d1e2ff;
            margin-top: 6px;
        }

        .action-btn {
            background: linear-gradient(95deg, #2d3e6e, #1f2c50);
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 50px;
            color: #ecf3ff;
            font-weight: 600;
            margin-top: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.85rem;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(100, 150, 255, 0.3);
        }

        .action-btn.primary {
            background: linear-gradient(95deg, #2b5bb5, #1a3f7a);
            box-shadow: 0 4px 12px rgba(43, 91, 181, 0.4);
        }

        .action-btn.primary:hover {
            transform: translateY(-2px);
            background: linear-gradient(95deg, #3a6dc9, #2a4d8a);
            box-shadow: 0 8px 18px rgba(43, 91, 181, 0.5);
        }

        .action-btn:hover {
            transform: translateY(-1px);
            background: linear-gradient(95deg, #3f5188, #2a3760);
        }

        .example-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .ex-chip {
            background: rgba(30, 45, 80, 0.8);
            border-radius: 60px;
            padding: 6px 14px;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            color: #c5dcff;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(80, 140, 255, 0.4);
        }

        .ex-chip:hover {
            background: #2e4a8a;
            transform: scale(0.96);
            color: white;
        }

        .content {
            flex: 1;
            padding: 1.8rem;
            background: rgba(5, 8, 20, 0.3);
        }

        .text-box {
            background: rgba(8, 12, 25, 0.6);
            border-radius: 1.5rem;
            padding: 1.2rem;
            margin-bottom: 1.8rem;
            border: 1px solid rgba(80, 140, 255, 0.3);
            backdrop-filter: blur(5px);
            transition: all 0.2s;
        }

        .text-box textarea {
            width: 100%;
            background: #010314;
            border: 1px solid #2f3a70;
            border-radius: 1.2rem;
            padding: 1rem;
            color: #f5f9ff;
            font-family: 'Courier New', 'Fira Code', monospace;
            font-size: 1rem;
            line-height: 1.5;
            resize: vertical;
            transition: 0.2s;
        }

        .text-box textarea:focus {
            outline: none;
            border-color: #5d8eff;
            box-shadow: 0 0 0 2px rgba(93, 142, 255, 0.2);
        }

        .result-area {
            background: #010314cc;
            border-radius: 1.2rem;
            padding: 1rem;
            border-left: 5px solid #5d8eff;
        }

        .result-text {
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            color: #eef3ff;
        }

        .badge {
            background: linear-gradient(115deg, #192c55, #0f1e3a);
            display: inline-block;
            padding: 5px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            color: #b6d0ff;
            border: 1px solid #4560a0;
        }

        .info-note {
            background: rgba(10, 18, 38, 0.7);
            border-radius: 1.2rem;
            padding: 12px 16px;
            font-size: 0.7rem;
            color: #a2b9f0;
            border: 1px solid #2a3d70;
            margin-top: 12px;
        }

        .glowing-text {
            background: linear-gradient(120deg, #bbd9ff, #7ba5ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 600;
        }

        button {
            font-family: inherit;
        }

        @media (max-width: 760px) {
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid rgba(80, 140, 255, 0.4);
            }
            .main-card {
                border-radius: 1.5rem;
            }
        }

        /* убираем лишние подписи, оставляем только нужное */
        .clean-text {
            font-weight: 500;
        }
    </style>
</head>
<body>
<div class="main-card">
    <div class="header">
        <h1>✨ Цезарь · Шифратор <span style="font-size: 0.8rem; background: #1e2f5a; padding: 4px 12px; border-radius: 40px; font-size: 0.7rem;">33 буквы + Ё</span></h1>
    </div>
    <div class="two-col">
        <div class="sidebar">
            <div class="mode-section">
                <div class="mode-buttons">
                    <button id="modeAutoBtn" class="mode-btn">🔍 ВЗЛОМ</button>
                    <button id="modeManualBtn" class="mode-btn active">✍️ РУЧНОЙ</button>
                </div>
                <div id="manualPanel">
                    <div class="shift-control">
                        <input type="range" id="shiftSlider" min="0" max="32" value="3">
                        <div class="shift-value">⚡ Сдвиг = <span id="shiftValue" style="font-weight:bold; color:#9bc0ff;">3</span></div>
                    </div>
                    <button id="encryptBtn" class="action-btn primary">🔒 ЗАШИФРОВАТЬ</button>
                    <button id="decryptBtn" class="action-btn">🔓 РАСШИФРОВАТЬ</button>
                </div>
                <div id="autoPanel" style="display: none;">
                    <button id="crackBtn" class="action-btn primary" style="margin-top: 5px;">⚡ ВЗЛОМАТЬ ТЕКСТ</button>
                    <div class="info-note" style="margin-top: 14px; text-align: center;">Частотный анализ</div>
                </div>
            </div>

            <div class="example-buttons">
                <div class="ex-chip" id="exRuBtn">🇷🇺 Пример</div>
                <div class="ex-chip" id="exEnBtn">🇬🇧 English</div>
                <div class="ex-chip" id="exEncodedBtn">🔐 Шифр (сдв.10)</div>
                <div class="ex-chip" id="clearBtn">🧹 Очистить</div>
            </div>
            <div class="info-note">
                💡 <span class="glowing-text">Поддержка Ё</span> · Кириллица/Латиница · Автовзлом по частотам
            </div>
        </div>

        <div class="content">
            <div class="text-box">
                <textarea id="inputText" rows="3" placeholder="Введите текст..."></textarea>
            </div>

            <div class="text-box">
                <div style="display: flex; justify-content: space-between; margin-bottom: 10px; align-items: center;">
                    <span id="resultBadge" class="badge">готов</span>
                </div>
                <div class="result-area">
                    <div id="outputText" class="result-text">⚡ Нажмите кнопку</div>
                </div>
                <div id="autoInfo" style="margin-top: 10px; font-size: 0.7rem; color: #98afea;"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // ---------- АЛФАВИТЫ ----------
    const RUS_LOW = "абвгдеёжзийклмнопрстуфхцчшщъыьэюя";
    const RUS_UP = "АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ";
    const ENG_LOW = "abcdefghijklmnopqrstuvwxyz";
    const ENG_UP = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    const rusFreq = {
        'а':0.0801,'б':0.0159,'в':0.0454,'г':0.0170,'д':0.0298,'е':0.0845,
        'ё':0.0020,'ж':0.0094,'з':0.0165,'и':0.0735,'й':0.0121,'к':0.0349,
        'л':0.0443,'м':0.0321,'н':0.0670,'о':0.1097,'п':0.0281,'р':0.0473,
        'с':0.0547,'т':0.0632,'у':0.0262,'ф':0.0026,'х':0.0097,'ц':0.0048,
        'ч':0.0144,'ш':0.0073,'щ':0.0036,'ъ':0.0004,'ы':0.0189,'ь':0.0173,
        'э':0.0032,'ю':0.0064,'я':0.0201
    };
    
    const engFreq = {
        'a':0.08167,'b':0.01492,'c':0.02782,'d':0.04253,'e':0.12702,'f':0.02228,
        'g':0.02015,'h':0.06094,'i':0.06966,'j':0.00153,'k':0.00772,'l':0.04025,
        'm':0.02406,'n':0.06749,'o':0.07507,'p':0.01929,'q':0.00095,'r':0.05987,
        's':0.06327,'t':0.09056,'u':0.02758,'v':0.00978,'w':0.02360,'x':0.00150,
        'y':0.01974,'z':0.00074
    };

    function shiftChar(ch, shift, lowAlphabet, upAlphabet) {
        const len = lowAlphabet.length;
        const lowerIdx = lowAlphabet.indexOf(ch);
        if (lowerIdx !== -1) {
            let newIdx = (lowerIdx + shift) % len;
            if (newIdx < 0) newIdx += len;
            return lowAlphabet[newIdx];
        }
        const upperIdx = upAlphabet.indexOf(ch);
        if (upperIdx !== -1) {
            let newIdx = (upperIdx + shift) % len;
            if (newIdx < 0) newIdx += len;
            return upAlphabet[newIdx];
        }
        return ch;
    }

    function detectLanguage(text) {
        let ruCount = 0, enCount = 0;
        for (let ch of text) {
            if (RUS_LOW.includes(ch.toLowerCase()) || RUS_UP.includes(ch)) ruCount++;
            else if (ENG_LOW.includes(ch.toLowerCase()) || ENG_UP.includes(ch)) enCount++;
        }
        if (ruCount === 0 && enCount === 0) return 'ru';
        return ruCount >= enCount ? 'ru' : 'en';
    }

    function caesarTransform(text, shift, lang) {
        if (lang === 'ru') {
            let result = "";
            for (let ch of text) result += shiftChar(ch, shift, RUS_LOW, RUS_UP);
            return result;
        } else {
            let result = "";
            for (let ch of text) result += shiftChar(ch, shift, ENG_LOW, ENG_UP);
            return result;
        }
    }

    function extractLetters(text, lang) {
        const alphabet = lang === 'ru' ? RUS_LOW : ENG_LOW;
        const letters = [];
        for (let ch of text) {
            const lowCh = ch.toLowerCase();
            if (alphabet.includes(lowCh)) letters.push(lowCh);
        }
        return letters;
    }

    function computeFreq(letters, lang) {
        const alphabet = lang === 'ru' ? RUS_LOW : ENG_LOW;
        const freq = {};
        for (let l of alphabet) freq[l] = 0;
        if (letters.length === 0) return freq;
        for (let l of letters) if (freq[l] !== undefined) freq[l]++;
        for (let l of alphabet) freq[l] /= letters.length;
        return freq;
    }

    function similarity(obs, expected, lang) {
        const alphabet = lang === 'ru' ? RUS_LOW : ENG_LOW;
        let dot = 0, normObs = 0, normExp = 0;
        for (let l of alphabet) {
            const o = obs[l] || 0;
            const e = expected[l] || 0;
            dot += o * e;
            normObs += o * o;
            normExp += e * e;
        }
        if (normObs === 0 || normExp === 0) return 0;
        return dot / (Math.sqrt(normObs) * Math.sqrt(normExp));
    }

    function autoCrack(text) {
        if (!text.trim()) return null;
        const detectedLang = detectLanguage(text);
        const maxShift = detectedLang === 'ru' ? 33 : 26;
        const expectedFreq = detectedLang === 'ru' ? rusFreq : engFreq;
        const results = [];
        for (let s = 0; s < maxShift; s++) {
            const decrypted = caesarTransform(text, s, detectedLang);
            const letters = extractLetters(decrypted, detectedLang);
            const freqObs = computeFreq(letters, detectedLang);
            const sim = similarity(freqObs, expectedFreq, detectedLang);
            results.push({ shift: s, score: sim, decryptedText: decrypted });
        }
        results.sort((a,b) => b.score - a.score);
        if (results[0].score < 0.2 && text.replace(/[^a-zA-Zа-яА-ЯёЁ]/g, '').length > 3) {
            const altLang = detectedLang === 'ru' ? 'en' : 'ru';
            const altMax = altLang === 'ru' ? 33 : 26;
            const altExpected = altLang === 'ru' ? rusFreq : engFreq;
            const altResults = [];
            for (let s = 0; s < altMax; s++) {
                const dec = caesarTransform(text, s, altLang);
                const lettersAlt = extractLetters(dec, altLang);
                const freqAlt = computeFreq(lettersAlt, altLang);
                const simAlt = similarity(freqAlt, altExpected, altLang);
                altResults.push({ shift: s, score: simAlt, decryptedText: dec });
            }
            altResults.sort((a,b) => b.score - a.score);
            if (altResults[0].score > results[0].score + 0.05) {
                return { best: altResults[0], all: altResults, lang: altLang };
            }
        }
        return { best: results[0], all: results, lang: detectedLang };
    }

    // ---------- UI ----------
    let currentMode = 'manual';
    const inputText = document.getElementById('inputText');
    const outputDiv = document.getElementById('outputText');
    const resultBadge = document.getElementById('resultBadge');
    const autoInfoDiv = document.getElementById('autoInfo');
    const modeAutoBtn = document.getElementById('modeAutoBtn');
    const modeManualBtn = document.getElementById('modeManualBtn');
    const manualPanel = document.getElementById('manualPanel');
    const autoPanel = document.getElementById('autoPanel');
    const shiftSlider = document.getElementById('shiftSlider');
    const shiftValueSpan = document.getElementById('shiftValue');
    const encryptBtn = document.getElementById('encryptBtn');
    const decryptBtn = document.getElementById('decryptBtn');
    const crackBtn = document.getElementById('crackBtn');
    const clearBtn = document.getElementById('clearBtn');
    const exRuBtn = document.getElementById('exRuBtn');
    const exEnBtn = document.getElementById('exEnBtn');
    const exEncodedBtn = document.getElementById('exEncodedBtn');

    function updateShiftDisplay() {
        shiftValueSpan.textContent = shiftSlider.value;
        if (currentMode === 'manual') resultBadge.textContent = `сдвиг ${shiftSlider.value}`;
    }

    function manualEncrypt() {
        const text = inputText.value;
        if (!text.trim()) { outputDiv.innerHTML = '⚠️ Введите текст'; return; }
        const shift = parseInt(shiftSlider.value, 10);
        const lang = detectLanguage(text);
        const encrypted = caesarTransform(text, shift, lang);
        outputDiv.innerHTML = escapeHtml(encrypted);
        resultBadge.textContent = `🔒 зашифровано (+${shift})`;
        autoInfoDiv.innerHTML = '';
    }

    function manualDecrypt() {
        const text = inputText.value;
        if (!text.trim()) { outputDiv.innerHTML = '⚠️ Введите текст'; return; }
        const shift = parseInt(shiftSlider.value, 10);
        const lang = detectLanguage(text);
        const decrypted = caesarTransform(text, -shift, lang);
        outputDiv.innerHTML = escapeHtml(decrypted);
        resultBadge.textContent = `🔓 расшифровано (-${shift})`;
        autoInfoDiv.innerHTML = '';
    }

    function autoCrackAction() {
        const text = inputText.value;
        if (!text.trim()) { outputDiv.innerHTML = '⚠️ Введите текст для взлома'; return; }
        outputDiv.innerHTML = '⏳ Анализ частот...';
        setTimeout(() => {
            const result = autoCrack(text);
            if (!result || !result.best) {
                outputDiv.innerHTML = '❌ Не удалось взломать. Попробуйте длиннее текст.';
                return;
            }
            const best = result.best;
            const langName = result.lang === 'ru' ? 'RU' : 'EN';
            outputDiv.innerHTML = escapeHtml(best.decryptedText);
            resultBadge.textContent = `🔓 взломан! сдвиг ${best.shift} (${langName}) | ${(best.score*100).toFixed(0)}%`;
            let topHtml = `<div style="margin-top: 6px;"><strong>🔁 Топ-3:</strong> `;
            for (let i = 0; i < Math.min(3, result.all.length); i++) {
                topHtml += `<span style="background:#1f2a55; border-radius:30px; padding:2px 10px; margin:0 3px;">сдв ${result.all[i].shift} (${(result.all[i].score*100).toFixed(0)}%)</span> `;
            }
            topHtml += `</div>`;
            autoInfoDiv.innerHTML = topHtml;
        }, 15);
    }

    function setExample(type) {
        if (type === 'ru') {
            inputText.value = 'Привет, как дела? Шифр Цезаря и буква Ё отлично работают!';
        } else if (type === 'en') {
            inputText.value = 'Hello, how are you? This is a secret message about Caesar cipher.';
        } else if (type === 'encoded') {
            inputText.value = 'Щшарпё, шкш шпёш? Ъшхэюм цб ёнщтпёу ёрхм Щбзбщс?';
        }
        if (currentMode === 'manual') manualEncrypt();
        else autoCrackAction();
    }

    function clearAll() {
        inputText.value = '';
        outputDiv.innerHTML = '🧹 Очищено';
        autoInfoDiv.innerHTML = '';
        resultBadge.textContent = currentMode === 'manual' ? `сдвиг ${shiftSlider.value}` : 'готов';
    }

    function switchMode(mode) {
        currentMode = mode;
        if (mode === 'manual') {
            manualPanel.style.display = 'block';
            autoPanel.style.display = 'none';
            modeManualBtn.classList.add('active');
            modeAutoBtn.classList.remove('active');
            resultBadge.textContent = `сдвиг ${shiftSlider.value}`;
        } else {
            manualPanel.style.display = 'none';
            autoPanel.style.display = 'block';
            modeAutoBtn.classList.add('active');
            modeManualBtn.classList.remove('active');
            resultBadge.textContent = `режим взлома`;
        }
        autoInfoDiv.innerHTML = '';
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    shiftSlider.addEventListener('input', () => {
        shiftValueSpan.textContent = shiftSlider.value;
        if (currentMode === 'manual') resultBadge.textContent = `сдвиг ${shiftSlider.value}`;
    });
    encryptBtn.addEventListener('click', () => { if (currentMode === 'manual') manualEncrypt(); });
    decryptBtn.addEventListener('click', () => { if (currentMode === 'manual') manualDecrypt(); });
    crackBtn.addEventListener('click', () => { if (currentMode === 'auto') autoCrackAction(); });
    clearBtn.addEventListener('click', clearAll);
    exRuBtn.addEventListener('click', () => setExample('ru'));
    exEnBtn.addEventListener('click', () => setExample('en'));
    exEncodedBtn.addEventListener('click', () => setExample('encoded'));
    modeAutoBtn.addEventListener('click', () => switchMode('auto'));
    modeManualBtn.addEventListener('click', () => switchMode('manual'));

    inputText.value = 'Привет, как дела?';
    manualEncrypt();
    updateShiftDisplay();
</script>
</body>
</html>
